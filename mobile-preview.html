<!doctype html>
<html lang="en">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Recipe Watch - Mobile Preview</title>
	<style>
		:root {
			color-scheme: light;
			--bg: #f2f4f8;
			--frame: #10131a;
			--screen: #ffffff;
			--border: #1f2430;
		}

		* {
			box-sizing: border-box;
		}

		body {
			margin: 0;
			min-height: 100vh;
			display: grid;
			place-items: center;
			background:
				radial-gradient(circle at 20% 20%, #ffffff 0%, transparent 35%),
				radial-gradient(circle at 80% 80%, #e6edf8 0%, transparent 40%),
				var(--bg);
			font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
		}

		.phone {
			width: min(100vw - 2rem, 430px);
			height: min(100vh - 2rem, 932px);
			padding: 12px;
			border-radius: 40px;
			background: linear-gradient(160deg, #1a2030, var(--frame));
			border: 1px solid var(--border);
			box-shadow:
				0 30px 60px rgba(9, 13, 20, 0.25),
				0 8px 20px rgba(9, 13, 20, 0.18);
		}

		.screen {
			width: 100%;
			height: 100%;
			border: 0;
			border-radius: 28px;
			background: var(--screen);
		}
	</style>
</head>

<body>
	<main class="phone" aria-label="Mobile app preview frame">
		<iframe class="screen" src="%BASE_URL%" title="Recipe Watch app"></iframe>
	</main>
</body>

</html>
