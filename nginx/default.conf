server {
	listen 80;
	server_name _;

	root /usr/share/nginx/html;
	index index.html;

	# Redirects must stay relative: the container is reached through a published port or a reverse
	# proxy, so the host and port nginx itself listens on are not the ones the client used.
	absolute_redirect off;

	location = /healthz {
		access_log off;
		add_header Content-Type text/plain;
		return 200 'ok';
	}

	# Expose preview page only when it exists in the artifact.
	location = /mobile-preview {
		try_files /mobile-preview.html =404;
	}

	location /assets/ {
		try_files $uri =404;
		add_header Cache-Control "public, max-age=31536000, immutable";
	}

	# Mocks of a candidate UI, served as a static site from the ui/ folder of the artifact.
	location = /ui {
		return 301 /ui/;
	}

	location /ui/ {
		try_files $uri $uri/ /ui/index.html;
	}

	location / {
		try_files $uri $uri/ /index.html;
	}

	include /etc/nginx/base-path-locations.inc;
}
